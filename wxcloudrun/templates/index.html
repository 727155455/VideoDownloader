<script>
  function formatBytes(bytes) {
    if (!bytes) {
      return "";
    }
    var units = ["B", "KB", "MB", "GB"];
    var size = bytes;
    var index = 0;
    while (size >= 1024 && index < units.length - 1) {
      size = size / 1024;
      index += 1;
    }
    return size.toFixed(index === 0 ? 0 : 1) + " " + units[index];
  }

  function setStatus(text, isError) {
    $("#download-status").text(text || "").css("color", isError ? "#d93026" : "rgba(0, 0, 0, 0.55)");
  }

  $("#download-submit").on("click", function () {
    var url = $.trim($("#video-url").val());
    if (!url) {
      setStatus("请先粘贴视频链接", true);
      return;
    }

    $("#download-result").hide();
    $("#download-submit").prop("disabled", true).text("处理中...");
    setStatus("正在解析并下载视频，请保持页面打开");

    $.ajax("/api/download", {
      method: "POST",
      contentType: "application/json; charset=utf-8",
      dataType: "json",
      data: JSON.stringify({
        url: url,
      }),
    }).done(function (res) {
      if (!res || res.code !== 0) {
        setStatus((res && res.errorMsg) || "视频处理失败，请稍后重试", true);
        return;
      }

      var data = res.data || {};
      var title = data.title || data.filename || "视频已处理完成";
      var meta = [data.ext ? data.ext.toUpperCase() : "", formatBytes(data.size)].filter(Boolean).join(" · ");

      $("#result-title").text(title);
      $("#result-meta").text(meta);
      $("#save-to-phone")
        .attr("href", data.downloadPath || "#")
        .attr("download", data.filename || "");
      $("#download-result").show();
      setStatus("处理完成，点击下方按钮即可保存到手机本地");
    }).fail(function () {
      setStatus("网络异常，请稍后重试", true);
    }).always(function () {
      $("#download-submit").prop("disabled", false).text("开始处理");
    });
  });
</script>
